<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracking | TW FleetMarschall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .leaflet-div-icon {
            background: transparent;
            border: none;
        }

        /* Scrollbar for fleet list */
        .scroller::-webkit-scrollbar {
            width: 4px;
        }

        .scroller::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col font-sans">
    <nav class="bg-[#0b1426] text-white p-3 px-6 flex justify-between items-center shadow-2xl sticky top-0 z-[1000]">
        <a href="../html/profile.html">
            <div class="flex items-center space-x-4">
                <img src="https://techno-welle.com/wp-content/uploads/2025/08/Group-86.png" alt="TW Logo"
                    class="h-10 w-auto">
                <div class="flex flex-col">
                    <span class="font-black text-lg leading-tight tracking-tight">TW <span
                            class="text-pink-400">FleetMarschall</span></span>
                    <span class="text-[9px] text-slate-400 uppercase tracking-[0.2em] font-bold">Real-Time
                        Intelligence</span>
                </div>
            </div>
        </a>
        <div class="flex items-center space-x-6">
            <div class="flex">
                <button onclick="logout()"
                    class="bg-red-600 hover:bg-red-500 text-white px-6 py-2 rounded-lg text-xs font-bold transition shadow-lg">LOGOUT</button>
            </div>
            <div class="flex">
                <a href="../html/profile.html"
                    class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg text-xs font-bold transition shadow-lg">
                    PROFILE</a>
            </div>
            <div class="flex bg-[#1a253d] rounded-xl p-1 shadow-inner">
                <a href="#"
                    class="bg-blue-600 text-white px-6 py-2 rounded-lg text-xs font-bold transition shadow-lg">LIVE
                    VIEW</a>
                <a href="../html/trips.html"
                    class="text-slate-400 hover:text-white px-6 py-2 rounded-lg text-xs font-bold transition">TRIP
                    HISTORY</a>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex flex-col md:flex-row h-[calc(100vh-64px)] overflow-hidden">

        <div class="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col z-20 shadow-xl">
            <div class="p-4 border-b border-slate-100 bg-slate-50">
                <h2 class="font-black text-slate-800 text-lg">Fleet List</h2>
                <p class="text-[10px] text-slate-500 uppercase font-bold">Select devices to track</p>
            </div>

            <div id="fleet-list" class="flex-1 overflow-y-auto p-2 space-y-2 scroller">
                <div class="text-center text-slate-400 text-xs mt-4">Loading fleet...</div>
            </div>

            <div class="p-3 bg-slate-900 text-white text-xs">
                <div class="flex justify-between">
                    <span>Active:</span>
                    <span id="active-count" class="font-bold text-emerald-400">0</span>
                </div>
            </div>
        </div>

        <div class="flex-1 relative">
            <div id="map" class="w-full h-full z-0"></div>

            <div id="info-panel"
                class="absolute top-4 right-4 w-72 bg-white/95 backdrop-blur rounded-2xl shadow-2xl border border-white/50 p-4 hidden z-[1000] transition-all">
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <h3 id="panel-name" class="font-black text-lg leading-none text-slate-800">--</h3>
                        <p id="panel-imei" class="text-[10px] text-slate-500 font-mono">--</p>
                    </div>
                    <button onclick="document.getElementById('info-panel').classList.add('hidden')"
                        class="text-slate-400 hover:text-red-500 font-bold">×</button>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div class="bg-slate-50 p-2 rounded-lg text-center">
                        <div class="text-[9px] text-slate-400 uppercase font-bold">Speed</div>
                        <div id="panel-speed" class="text-xl font-black text-slate-800">0 <span
                                class="text-[10px]">km/h</span></div>
                    </div>
                    <div class="bg-slate-50 p-2 rounded-lg text-center">
                        <div class="text-[9px] text-slate-400 uppercase font-bold">Ignition</div>
                        <div id="panel-ign" class="text-xs font-bold mt-1">--</div>
                    </div>
                </div>

                <div class="space-y-1 text-xs text-slate-600">
                    <div class="flex justify-between"><span>Odometer:</span> <span id="panel-odo"
                            class="font-bold">--</span></div>
                    <div class="flex justify-between"><span>GNSS:</span> <span id="panel-gnss"
                            class="font-bold">--</span></div>
                    <div class="flex justify-between"><span>Voltage:</span> <span id="panel-batt"
                            class="font-bold">--</span></div>
                    <div class="flex justify-between"><span>Satellites:</span> <span id="panel-sats"
                            class="font-bold">--</span></div>
                    <div class="flex justify-between mt-2 pt-2 border-t"><span>Updated:</span> <span id="panel-time"
                            class="font-mono text-[10px]">--</span></div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="../js/live.js"></script>
</body>

</html>
